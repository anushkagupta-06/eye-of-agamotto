port: 4222
http: 8222            # monitoring endpoint (/healthz, /jsz)
server_name: eoa-nats

jetstream {
  store_dir: /data
  max_file_store: 20GB
  max_memory_store: 0
}

max_payload: 8MB      # must be >= stream max_msg_size
max_connections: 1024

# v1: single shared token supplied through the environment.
# Hardening backlog: per-service users with subject-scoped permissions and TLS.
authorization {
  token: $NATS_AUTH_TOKEN
}
